<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid pattern overlay -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Outer Card Frame -->
  <rect x="60" y="50" width="1080" height="530" rx="20" fill="#182234" stroke="#334155" stroke-width="2" filter="url(#shadow)" />

  <!-- Badge / Tag -->
  <rect x="100" y="90" width="220" height="34" rx="17" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
  <text x="210" y="112" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">n8n WORKFLOW CANVAS</text>

  <!-- Title -->
  <text x="100" y="170" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">ReAct Agent Orchestration Pipeline</text>
  <text x="100" y="205" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">Webhook Trigger ➔ Gemini / Groq Reasoning Loop ➔ Calendar CRUD Tools</text>

  <!-- Visual Workflow Diagram Blocks -->
  <!-- Webhook Node -->
  <g transform="translate(100, 260)">
    <rect width="200" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="40" cy="40" r="16" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="40" y="45" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="70" y="45" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="600">Webhook</text>
    <text x="25" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13">POST /webhook/voxcal</text>
    <text x="25" y="105" fill="#64748b" font-family="sans-serif" font-size="12">Receives JSON payload</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 300 325 L 370 325" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6" />
  <polygon points="375,325 365,320 365,330" fill="#38bdf8" />

  <!-- ReAct Agent Node -->
  <g transform="translate(380, 240)">
    <rect width="250" height="170" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    <circle cx="40" cy="40" r="16" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
    <text x="40" y="45" fill="#818cf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🧠</text>
    <text x="70" y="45" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="600">ReAct Agent Node</text>
    <text x="25" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13">• Gemini 1.5 Pro / Flash</text>
    <text x="25" y="105" fill="#94a3b8" font-family="sans-serif" font-size="13">• Groq LLaMA 3.3 70B</text>
    <text x="25" y="130" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="500">Autonomous Tool Calling</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 630 325 L 700 325" stroke="#818cf8" stroke-width="3" stroke-dasharray="6,6" />
  <polygon points="705,325 695,320 695,330" fill="#818cf8" />

  <!-- Calendar Tools Group -->
  <g transform="translate(710, 240)">
    <rect width="380" height="170" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="40" cy="40" r="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <text x="40" y="45" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">📅</text>
    <text x="70" y="45" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="600">Calendar Task Tools (CRUD)</text>
    <rect x="25" y="65" width="150" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="100" y="88" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">➕ Create Event Tool</text>
    <rect x="200" y="65" width="155" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="277" y="88" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">🔍 Query Calendar Tool</text>
    <rect x="25" y="115" width="150" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="100" y="138" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">✏️ Update Event Tool</text>
    <rect x="200" y="115" width="155" height="35" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="277" y="138" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">❌ Delete Event Tool</text>
  </g>

  <!-- Footer placeholder notice -->
  <rect x="100" y="470" width="1000" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-dasharray="4,4" />
  <text x="600" y="506" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">📷 Export your n8n workflow canvas screenshot and save as <tspan fill="#38bdf8" font-family="monospace">docs/assets/n8n-workflow.png</tspan></text>
</svg>
